<!-- RFPlay Airport Manager — Orders -->
<div class="page-view" id="page-orders">
  <div class="page-header">
    <div>
      <h1 class="page-title">Orders</h1>
      <p class="page-subtitle">View and manage service orders</p>
    </div>
  </div>

  <div class="table-container">
    <div class="table-toolbar">
      <div class="table-toolbar-left">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" class="form-input" placeholder="Search order ID or user..." id="orders-search" oninput="Orders.filter()" style="width:240px;">
        </div>
        <select class="form-select" id="orders-status-filter" onchange="Orders.filter()" style="width:140px;">
          <option value="all">All Status</option>
          <option value="active">Active</option>
          <option value="pending">Pending</option>
          <option value="cancelled">Cancelled</option>
          <option value="expired">Expired</option>
        </select>
        <select class="form-select" id="orders-service-filter" onchange="Orders.filter()" style="width:160px;">
          <option value="all">All Services</option>
          <option value="airport-wifi">Airport WiFi</option>
          <option value="gateway-pro">Gateway Pro</option>
          <option value="analytics-basic">Analytics Basic</option>
          <option value="analytics-advanced">Analytics Advanced</option>
          <option value="premium-support">Premium Support</option>
        </select>
      </div>
      <div class="table-toolbar-right">
        <span class="text-muted text-sm" id="orders-count"></span>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>User</th>
          <th>Service</th>
          <th>Status</th>
          <th>Amount</th>
          <th>Created</th>
          <th>Expires</th>
        </tr>
      </thead>
      <tbody id="orders-table-body">
        <tr><td colspan="7" class="table-empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>
