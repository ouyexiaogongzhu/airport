<!-- RFPlay Airport Manager — Dashboard -->
<div class="page-view" id="page-dashboard">
  <div class="page-header">
    <div>
      <h1 class="page-title">Dashboard</h1>
      <p class="page-subtitle">Overview of your airport network</p>
    </div>
    <span class="text-muted text-sm" id="dashboard-date"></span>
  </div>

  <div class="stat-grid" id="stats-container">
    <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="stat-users">—</div><div class="stat-trend" id="stat-users-trend"></div></div>
    <div class="stat-card"><div class="stat-label">Total Nodes</div><div class="stat-value" id="stat-nodes">—</div><div class="stat-trend" id="stat-nodes-trend"></div></div>
    <div class="stat-card"><div class="stat-label">Active Nodes</div><div class="stat-value" id="stat-active-nodes">—</div><div class="stat-trend"><span class="text-muted text-sm">online</span></div></div>
    <div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value" id="stat-orders">—</div><div class="stat-trend" id="stat-orders-trend"></div></div>
    <div class="stat-card"><div class="stat-label">Pending Orders</div><div class="stat-value" id="stat-pending-orders">—</div><div class="stat-trend"><span class="text-muted text-sm">awaiting</span></div></div>
    <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value" id="stat-revenue">—</div><div class="stat-trend" id="stat-revenue-trend"></div></div>
  </div>
</div>
