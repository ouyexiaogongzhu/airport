<!-- RFPlay Airport Manager — Login Page Template -->
<div class="login-page" id="login-page">
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-icon-lg">RF</div>
      <h1>Airport Manager</h1>
      <p class="login-sub">Sign in to your account</p>
    </div>

    <div class="login-error" id="login-error">Invalid credentials</div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Enter your username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">
        Sign In
      </button>
    </form>

    <p class="text-muted text-sm" style="text-align:center;margin-top:16px;">
      Demo: any username / any password
    </p>
  </div>
</div>
