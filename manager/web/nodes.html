<!-- RFPlay Airport Manager — Nodes -->
<div class="page-view" id="page-nodes">
  <div class="page-header">
    <div>
      <h1 class="page-title">Nodes</h1>
      <p class="page-subtitle">Manage gateway nodes and kiosks</p>
    </div>
    <button class="btn btn-primary" onclick="Nodes.openCreate()">+ Add Node</button>
  </div>

  <div class="table-container">
    <div class="table-toolbar">
      <div class="table-toolbar-left">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" class="form-input" placeholder="Search nodes..." id="nodes-search" oninput="Nodes.filter()" style="width:220px;">
        </div>
        <select class="form-select" id="nodes-status-filter" onchange="Nodes.filter()" style="width:140px;">
          <option value="all">All Status</option>
          <option value="online">Online</option>
          <option value="offline">Offline</option>
          <option value="maintenance">Maintenance</option>
        </select>
      </div>
      <div class="table-toolbar-right">
        <span class="text-muted text-sm" id="nodes-count"></span>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Status</th>
          <th>IP Address</th>
          <th>Location</th>
          <th>Uptime</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="nodes-table-body">
        <tr><td colspan="7" class="table-empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Node Create/Edit Modal -->
<div class="modal-overlay" id="node-modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="node-modal-title">Add Node</span>
      <button class="modal-close" onclick="Nodes.closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="node-name">Node Name</label>
        <input type="text" class="form-input" id="node-name" placeholder="e.g. LHR-Gate-B7">
      </div>
      <div class="form-group">
        <label for="node-type">Type</label>
        <select class="form-select" id="node-type">
          <option value="gateway">Gateway</option>
          <option value="kiosk">Kiosk</option>
          <option value="scanner">Scanner</option>
        </select>
      </div>
      <div class="form-group">
        <label for="node-ip">IP Address</label>
        <input type="text" class="form-input" id="node-ip" placeholder="10.0.0.1">
      </div>
      <div class="form-group">
        <label for="node-location">Location</label>
        <input type="text" class="form-input" id="node-location" placeholder="e.g. London Heathrow">
      </div>
      <div class="form-group">
        <label for="node-status">Status</label>
        <select class="form-select" id="node-status">
          <option value="online">Online</option>
          <option value="offline">Offline</option>
          <option value="maintenance">Maintenance</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="Nodes.closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="Nodes.save()" id="node-save-btn">Save</button>
    </div>
  </div>
</div>
