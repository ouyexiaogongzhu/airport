name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  worker:
    name: Worker API (TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run

  frontend:
    name: Portal & Admin (Vue3)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [portal, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: ${{ matrix.project }}
        run: npm install --no-audit --no-fund
      - working-directory: ${{ matrix.project }}
        run: npm run build
