name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.29.2"

jobs:
  # Backend: Go 单元测试
  backend:
    name: Manager API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: manager/go.sum
      - run: go mod download
      - run: go build -v ./cmd/server/
      - run: go test -v -count=1 -timeout 30s ./...

  # Frontend: Portal + Admin
  frontend:
    name: Portal & Admin (Vue3)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [portal, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.project }}
      - run: npx vue-tsc --noEmit
        working-directory: ${{ matrix.project }}
      - run: npm run build
        working-directory: ${{ matrix.project }}

  # Flutter: Analyze + Test
  flutter:
    name: Flutter Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Docker: Build + smoke test
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Manager
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.manager
          load: true
          tags: rfplay-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.nginx
          load: true
          tags: rfplay-nginx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker compose up -d manager nginx
          sleep 5
          curl -sf http://localhost/health | grep -q ok
          curl -sf http://localhost/ | grep -q DOCTYPE
          curl -sf http://localhost/admin/ | grep -q DOCTYPE
          docker compose down
