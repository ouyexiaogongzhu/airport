name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "admin/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Requires GitHub secret CLOUDFLARE_PAGES_API_TOKEN (Account → Cloudflare Pages → Edit).
# Falls back to CLOUDFLARE_API_TOKEN when the Pages secret is not set.
# Keep Workers/D1 on CLOUDFLARE_API_TOKEN for deploy-worker.yml — do not replace
# that secret with a Pages-only token.

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: portal
            project: rfplay-portal
          - app: admin
            project: rfplay-admin
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          # axios baseURL must include /api/v1 — routes are /api/v1/public/login etc.
          VITE_API_BASE_URL: https://api.rfplay.uk/api/v1
          # subscription helper appends /api/v1 if missing; host-only is correct here
          VITE_SUBSCRIPTION_BASE_URL: https://api.rfplay.uk
          # portal only — Turnstile sitekey (admin build ignores unused Vite vars)
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN != '' && secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d3376ef411a0e5f321acb1ee848d2ec1
          workingDirectory: ${{ matrix.app }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=${{ matrix.project }} --branch=main --commit-dirty=true
