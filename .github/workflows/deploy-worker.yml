name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        working-directory: workers/api
        run: npm install --no-audit --no-fund

      - name: Apply D1 schema (idempotent)
        working-directory: workers/api
        run: npx wrangler d1 execute rfplay --remote --file=migrations/0001_schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d3376ef411a0e5f321acb1ee848d2ec1

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d3376ef411a0e5f321acb1ee848d2ec1
          workingDirectory: workers/api
