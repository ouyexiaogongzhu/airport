# RFPlay Airport — Nginx Main Configuration
# WebSocket reverse proxy for Manager API + Xray-core inbound
#
# Install: sudo ln -sf /path/to/rfplay.conf /etc/nginx/sites-enabled/
# Test:    sudo nginx -t
# Reload:  sudo systemctl reload nginx

server {
    listen 80;
    server_name rfplay.example.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name rfplay.example.com;

    # SSL — managed by Cloudflare Origin CA
    ssl_certificate     /etc/ssl/certs/rfplay.example.com.pem;
    ssl_certificate_key /etc/ssl/private/rfplay.example.com.key;

    # Cloudflare origin configuration snippet
    include /etc/nginx/conf.d/cf-origin.conf;

    # --- Manager API reverse proxy ---
    # All /api/v1/* requests go to the Manager backend
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for API calls
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # --- Xray-core WebSocket inbound ---
    # VMess over WebSocket path
    location /xray/ws {
        proxy_pass http://127.0.0.1:443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket requires longer timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;

        # Disable buffering for WebSocket
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # --- Xray-core VLESS over WebSocket inbound ---
    location /xray/vless-ws {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # --- Health check endpoint ---
    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- Deny all other requests ---
    location / {
        return 404;
    }
}
