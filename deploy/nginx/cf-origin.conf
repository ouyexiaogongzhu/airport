# Cloudflare Origin Configuration Snippet
# Include in server blocks behind Cloudflare CDN.
# Place in /etc/nginx/conf.d/cf-origin.conf or include from site config.
#
# Cloudflare IP ranges: https://www.cloudflare.com/ips/
# Update periodically:
#   curl -s https://www.cloudflare.com/ips-v4 > /etc/nginx/conf.d/cf-ips.conf
#   curl -s https://www.cloudflare.com/ips-v6 >> /etc/nginx/conf.d/cf-ips.conf

# --- TLS Configuration (Cloudflare recommended) ---
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_ecdh_curve secp384r1;

# Session cache
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# --- PROXY Protocol ---
# If Cloudflare is configured to send PROXY protocol, uncomment:
# listen 443 ssl http2 proxy_protocol;
