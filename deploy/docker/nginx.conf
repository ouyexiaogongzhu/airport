# RFPlay Airport — Nginx Production Configuration (Docker)
# Serves Portal SPA, Admin SPA, reverse proxies Manager API + Xray-core (optional)

# Docker DNS resolver — enables optional upstreams via variables
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name rfplay.uk api.rfplay.uk;
    server_tokens off;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS (except ACME)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name rfplay.uk;
    server_tokens off;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/rfplay.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rfplay.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Portal SPA
    location / {
        root /usr/share/nginx/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Admin SPA
    location /admin {
        alias /usr/share/nginx/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Manager API reverse proxy
    location /api/v1/ {
        proxy_pass http://manager:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # Health check
    location /health {
        proxy_pass http://manager:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Xray WS inbound (optional — uses variable so nginx starts even if xray is down)
    set $xray_ws "xray:443";
    location /xray/ws {
        proxy_pass http://$xray_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    set $xray_vless "xray:8443";
    location /xray/vless-ws {
        proxy_pass http://$xray_vless;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Deny all other requests
    location / {
        return 404;
    }
}

# API subdomain
server {
    listen 443 ssl http2;
    server_name api.rfplay.uk;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.rfplay.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rfplay.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://manager:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
