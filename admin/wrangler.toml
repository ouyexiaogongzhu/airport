# Cloudflare Pages — admin (xva.rfplay.uk)
# Deploy: wrangler pages deploy dist --project-name=rfplay-admin
# Functions: ./functions (picked up from this cwd).
#
# Local with Service Binding:
#   (terminal 1) cd workers/api && npx wrangler dev
#   (terminal 2) npx wrangler pages dev dist --service API=rfplay-api

name = "rfplay-admin"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[[services]]
binding = "API"
service = "rfplay-api"
